name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npm run lint
            - run: npm run format:check
            - run: npm test
            - run: npm run build
              env:
                  # Public values are inlined at build time; Turnstile's always-pass test key.
                  PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
            - run: npm run verify:dist
